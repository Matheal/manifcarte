# Collecte les mobilisations, reconstruit le site et le publie sur GitHub Pages.
# Tourne toutes les 20 minutes, à chaque modification du code, ou à la demande
# (onglet Actions > « Mise à jour de la carte » > Run workflow).
name: Mise à jour de la carte

on:
  schedule:
    - cron: "*/20 * * * *"
  push:
    branches: [main]
  # Ajouts, restrictions et suppressions proposés via les formulaires (onglet Issues).
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  workflow_dispatch:

permissions:
  contents: write   # écrire les données sur la branche « data »
  issues: write     # lire les contributions et y répondre
  pages: write      # publier le site
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Les données collectées vivent sur une branche séparée « data » :
      # l'historique de main reste propre et tu n'as jamais de conflit à gérer.
      - name: Récupérer les données précédentes
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git clone --quiet --depth 1 --branch data "$REPO_URL" store
          else
            mkdir store && cd store && git init --quiet -b data && git remote add origin "$REPO_URL"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le collecteur
        run: pip install -r requirements.txt

      - name: Tests du collecteur
        run: python -m pytest -q collector/tests

      - name: Collecter les mobilisations
        env:
          MANIFCARTE_CONTACT: ${{ github.server_url }}/${{ github.repository }}
          # Clé gratuite Google AI Studio (Settings > Secrets and variables > Actions).
          # Sans elle, l'analyse IA est simplement désactivée.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Compte Bluesky dédié au robot (facultatif) : identifiant + mot de passe d'application.
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          # Lecture des contributions (issues) et réponses automatiques.
          GITHUB_TOKEN: ${{ github.token }}
          MANIFCARTE_NOTIFY: "1"
          MANIFCARTE_SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m collector.main --data-dir store --out site/public/data/events.json

      - name: Sauvegarder les données
        working-directory: store
        run: |
          cp ../site/public/data/events.json events.json
          git config user.name "manifcarte-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git commit --quiet -m "Données du $(date -u +'%Y-%m-%d %H:%M') UTC"; then
            git push --quiet origin data
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - id: pages
        uses: actions/configure-pages@v6

      - name: Construire le site
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          # Lien de dons (Ko-fi, Liberapay…) : Settings > Secrets and variables > Actions > Variables.
          PUBLIC_DONATE_URL: ${{ vars.DONATE_URL }}
          # Relais du formulaire « sans compte » (tools/formulaire-sans-compte/LISEZMOI.md).
          PUBLIC_REPORT_ENDPOINT: ${{ vars.REPORT_ENDPOINT }}
          ASTRO_TELEMETRY_DISABLED: 1
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
